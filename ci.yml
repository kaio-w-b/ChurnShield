name: ChurnShield AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  MLFLOW_TRACKING_URI: "http://localhost:5000"

jobs:

  # ============================================================
  # Job 1: Qualidade de Código
  # ============================================================
  code-quality:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install linting tools
        run: pip install ruff black mypy

      - name: Run ruff (linting)
        run: ruff check src/ api/ tests/

      - name: Check black formatting
        run: black --check src/ api/ tests/

  # ============================================================
  # Job 2: Testes Unitários e de Integração
  # ============================================================
  tests:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: code-quality

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Coverage gate (>= 75%)
        run: |
          coverage report --fail-under=75

  # ============================================================
  # Job 3: Validação do Modelo
  # ============================================================
  model-validation:
    name: 🤖 Model Validation
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data and validate
        run: |
          python -c "
          from src.data.data_loader import ChurnDataLoader, DataValidator
          loader = ChurnDataLoader()
          df = loader.load(use_synthetic=True)
          validator = DataValidator()
          result = validator.validate(df)
          assert result['is_valid'], f'Validação falhou: {result}'
          print('✅ Validação de dados: OK')
          print(f'   Amostras: {len(df):,}')
          print(f'   Churn rate: {df[\"churn\"].mean():.1%}')
          "

      - name: Test feature pipeline
        run: |
          python -c "
          import numpy as np
          from src.data.data_loader import ChurnDataLoader
          from src.features.feature_engineering import build_feature_pipeline
          import yaml
          with open('config/config.yaml') as f:
              config = yaml.safe_load(f)
          loader = ChurnDataLoader(config)
          df = loader.load(use_synthetic=True)
          X_train, X_test, y_train, y_test = loader.get_splits(df)
          pipeline = build_feature_pipeline(config)
          X_tr = pipeline.fit_transform(X_train)
          X_te = pipeline.transform(X_test)
          assert not np.isnan(X_tr).any(), 'NaN no treino!'
          assert not np.isnan(X_te).any(), 'NaN no teste!'
          print(f'✅ Pipeline OK: {X_tr.shape[1]} features geradas')
          "

  # ============================================================
  # Job 4: Build Docker
  # ============================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: model-validation
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: false
          tags: churnshield-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 5: Relatório de Status
  # ============================================================
  status-report:
    name: 📊 Status Report
    runs-on: ubuntu-latest
    needs: [code-quality, tests, model-validation]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🛡️ ChurnShield AI — Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Model Validation | ${{ needs.model-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

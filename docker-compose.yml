version: "3.9"

# ============================================================
# ChurnShield AI — Docker Compose
# Serviços: API FastAPI + MLflow Tracking Server
# ============================================================

services:

  # ----------------------------------------------------------
  # API de Predição (FastAPI)
  # ----------------------------------------------------------
  churnshield-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: churnshield-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_VERSION=latest
      - LOG_LEVEL=info
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - churnshield-net

  # ----------------------------------------------------------
  # MLflow Tracking Server
  # ----------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: churnshield-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - churnshield-net

# ----------------------------------------------------------
# Volumes e Redes
# ----------------------------------------------------------
volumes:
  mlflow-data:
    driver: local

networks:
  churnshield-net:
    driver: bridge
